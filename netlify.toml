[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# API pozivi idu na serverless funkcije
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — sve ostalo servira index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
