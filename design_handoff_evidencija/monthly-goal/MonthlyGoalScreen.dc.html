<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><style>.mg-input::placeholder{color:var(--color-text-secondary)}</style></helmet>
<div style="position:relative;width:390px;height:844px;border-radius:40px;border:1px solid var(--color-surface-border);overflow:hidden;background:var(--color-background);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,system-ui,sans-serif">
<div aria-hidden="true" style="position:absolute;inset:0;padding:67px 16px 24px;display:flex;flex-direction:column;gap:24px">
<div style="color:var(--color-text-primary);font-size:30px;font-weight:800;letter-spacing:0.5px;text-align:center">Evidencija</div>
<div style="display:flex;gap:12px"><div style="flex:1;height:188px;border-radius:24px;border:1px solid var(--color-card-border);background:linear-gradient(135deg,var(--color-card-gradient-from),var(--color-card-gradient-to))"></div><div style="flex:1;height:188px;border-radius:24px;border:1px solid var(--color-card-border);background:linear-gradient(135deg,var(--color-card-gradient-from),var(--color-card-gradient-to))"></div></div>
<div style="height:420px;border-radius:24px;background:linear-gradient(135deg,var(--color-card-light-gradient-from),var(--color-card-light-gradient-to))"></div>
</div>
<div style="position:absolute;inset:0;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);background:color-mix(in srgb,var(--color-background) 35%,transparent)"></div>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:24px">
<div style="background:var(--color-surface);border-radius:24px;border:1px solid var(--color-surface-border);padding:24px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
<div style="color:var(--color-text-secondary);font-size:13px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase">Mjesečni cilj</div>
<div style="color:var(--color-text-primary);font-size:22px;font-weight:700;text-align:center">Koliko dolazaka mjesečno?</div>
</div>
<div style="position:relative">
<input class="mg-input" inputmode="numeric" maxlength="2" placeholder="npr. 12" value="{{ value }}" onChange="{{ onChange }}" style="width:100%;height:64px;border-radius:16px;border:1px solid var(--color-surface-border);background:var(--color-background);color:var(--color-text-primary);font:inherit;font-size:30px;font-weight:800;text-align:center;outline:none"></input>
<sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;border-radius:16px;border:1px solid var(--color-danger);pointer-events:none"></div></sc-if>
</div>
<sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}"><div style="color:var(--color-danger);font-size:13px;text-align:center;margin-top:-8px">{{ error }}</div></sc-if>
<button type="button" onClick="{{ save }}" style="height:52px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--color-button-primary-from),var(--color-button-primary-to));color:var(--color-button-primary-text);font:inherit;font-size:16px;font-weight:700;cursor:pointer" style-active="opacity:0.85">Spremi</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;error&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;'default'|'error'&quot;}}">
class Component extends DCLogic {
  state = this.props.variant === 'error'
    ? { value: '40', error: 'Cilj može biti najviše 31' }
    : { value: '12', error: null };
  save = () => {
    const n = this.state.value === '' ? NaN : parseInt(this.state.value, 10);
    let error = null;
    if (Number.isNaN(n) || n < 1) error = 'Cilj mora biti barem 1';
    else if (n > 31) error = 'Cilj može biti najviše 31';
    this.setState({ error });
  };
  renderVals() {
    return {
      value: this.state.value,
      error: this.state.error,
      hasError: !!this.state.error,
      onChange: (e) => this.setState({ value: e.target.value.replace(/[^0-9]/g, '').slice(0, 2), error: null }),
      save: this.save,
    };
  }
}
</script>
</body>
</html>
